name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  library:
    name: Library (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The full suite needs node:sqlite (Node 22.5+); Node 20 gets the smoke test below.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: No runtime dependencies (CODE_POLICY.md §2)
        run: node -e "const d = require('./package.json').dependencies ?? {}; if (Object.keys(d).length) { console.error('Runtime dependencies are not allowed:', d); process.exit(1) }"
      - name: The package ships no tests or secrets
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path)
            const bad = files.filter((f) => /\.test\.js$|(^|\/)\.env|\.dev\.vars|^test\//.test(f))
            if (bad.length) { console.error('Unexpected files in the package:', bad); process.exit(1) }
            console.log(files.length, 'files in the package')
          "

  node20:
    name: Library (Node 20 smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # No install: the library has no dependencies, and this proves it.
      - run: node test/smoke.mjs

  dependency-review:
    name: Dependency review
    # Needs GitHub's dependency graph: free on public repositories, GitHub Code Security on private ones.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.32.0 --offline --min-severity low .github/workflows
