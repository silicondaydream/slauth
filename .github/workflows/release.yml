name: Release

# Publishing happens here and only here: push a tag like v2.0.1 that matches
# package.json's version. It runs the checks again, then publishes with npm's trusted
# publishing (OIDC), so there's no npm token stored anywhere.
#
# One-time setup:
#   1. npmjs.com → slauthjs → Settings → Trusted publishing: add this repository and
#      the workflow file name "release.yml", environment "npm".
#   2. GitHub → Settings → Environments → "npm": require a reviewer, and allow only
#      tags matching v* to deploy.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No pnpm cache here: a release builds from a clean slate.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then echo "Tag $TAG doesn't match package.json ($version)"; exit 1; fi
      - run: pnpm test
      - run: pnpm typecheck
      - run: node test/smoke.mjs
      - name: Publish
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          # npm can only attest provenance for public repositories.
          if [ "$PRIVATE" = "true" ]; then npm publish; else npm publish --provenance; fi
